<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PicoSim 교사</title>
<meta name="description" content="PicoSim 교사 인증">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ground:#ecf0ec;--surface:#fff;--ink:#17221b;--muted:#5d6d63;--line:#d3dcd5;--accent:#c51a4a;--accent-ink:#fff;--ok:#1d8a4b;--err:#c8323b;--font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme='light']){--ground:#0e1411;--surface:#161e19;--ink:#e3ece6;--muted:#93a49a;--line:#2a3730;--accent:#f0577e;--accent-ink:#1a0c11;--ok:#4cc97f;--err:#ff6b73;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font:14px/1.55 var(--font);display:flex;align-items:flex-start;justify-content:center;padding:24px}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
header h1{font-size:20px;margin:0 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.btn{font:500 13.5px var(--font);border-radius:8px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 11px;font-size:12.5px}
.muted{color:var(--muted)}
.ok{color:var(--ok)}
.err{color:var(--err)}
.msg{color:var(--muted)}
.eyebrow{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:6px 0 0}
.t-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.t-list li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.t-list li:hover{border-color:var(--ink)}
.t-list li.sel{border-color:var(--accent);font-weight:700}
.t-table{width:100%;border-collapse:collapse;margin-top:2px}
.t-table th,.t-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.t-table th{color:var(--muted);font-weight:500;font-size:12.5px}
.t-table tbody tr{cursor:pointer}
.t-table tbody tr:hover{background:var(--ground)}
.t-table tbody tr.sel{background:var(--line)}
.t-table tbody tr.sel td{font-weight:700}
.t-timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.t-timeline li{padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px}
.t-timeline li:last-child{border-bottom:none}
.row{display:flex;gap:8px;align-items:center}
textarea{font:14px/1.5 var(--font);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.t-feedback-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.t-feedback-list li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.t-feedback-list li p{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>PicoSim 교사</h1></header>

  <div id="t-logged-out" class="card">
    <p class="muted">교사 계정으로 로그인하세요.</p>
    <button id="t-login" class="btn" type="button">Google로 로그인</button>
  </div>

  <div id="t-checking" class="card" hidden>
    <p class="msg">로그인 확인 중...</p>
  </div>

  <div id="t-approved" class="card" hidden>
    <p><b id="t-name"></b> 선생님</p>
    <p class="ok">교사 인증 성공</p>

    <div id="t-classes-loading" hidden><p class="msg">담당 학급을 불러오는 중...</p></div>
    <div id="t-classes-empty" hidden><p class="muted">아직 배정된 학급이 없습니다.</p></div>
    <div id="t-classes-list" hidden>
      <h2 class="eyebrow">담당 학급</h2>
      <ul id="t-classes-ul" class="t-list"></ul>
    </div>

    <div id="t-students-loading" hidden><p class="msg">학생 목록을 불러오는 중...</p></div>
    <div id="t-students-empty" hidden><p class="muted">이 학급에는 학생이 없습니다.</p></div>
    <div id="t-students-list" hidden>
      <h2 class="eyebrow">학생 목록</h2>
      <table class="t-table">
        <thead><tr><th>번호</th><th>이름</th></tr></thead>
        <tbody id="t-students-tbody"></tbody>
      </table>
    </div>

    <p id="t-timeline-student" class="eyebrow"></p>
    <div id="t-timeline-loading" hidden><p class="msg">학습 기록을 불러오는 중...</p></div>
    <div id="t-timeline-empty" hidden><p class="muted">아직 기록된 학습 활동이 없습니다.</p></div>
    <div id="t-timeline-list" hidden>
      <ul id="t-timeline-ul" class="t-timeline"></ul>
    </div>

    <div id="t-feedback-section" hidden>
      <h2 class="eyebrow">교사 피드백</h2>
      <textarea id="t-feedback-input" rows="3" placeholder="이 학생에게 남길 피드백을 입력하세요"></textarea>
      <div class="row">
        <button id="t-feedback-save" class="btn small" type="button">피드백 저장</button>
        <button id="t-feedback-cancel" class="btn ghost small" type="button" hidden>취소</button>
      </div>
      <div id="t-feedback-loading" hidden><p class="msg">피드백을 불러오는 중...</p></div>
      <div id="t-feedback-empty" hidden><p class="muted">아직 작성된 피드백이 없습니다.</p></div>
      <div id="t-feedback-error" hidden>
        <p class="err" id="t-feedback-error-msg"></p>
        <button id="t-feedback-retry" class="btn ghost small" type="button">다시 시도</button>
      </div>
      <ul id="t-feedback-ul" class="t-feedback-list" hidden></ul>
    </div>

    <div id="t-error" hidden>
      <p class="err" id="t-error-msg"></p>
      <button id="t-retry" class="btn ghost small" type="button">다시 시도</button>
    </div>
  </div>

  <div id="t-not-approved" class="card" hidden>
    <p class="err">등록되지 않은 교사 계정입니다.</p>
  </div>

  <button id="t-logout" class="btn ghost" type="button" hidden>로그아웃</button>
</div>
<script>/*__TEACHER_JS__*/</script>
</body>
</html>
